name: "Build Windows - Insapp-meet"

# Собирает Windows-версию Insapp-meet (.msi + .exe установщики) в облаке.
# Запуск: вкладка Actions → "Build Windows - Insapp-meet" → Run workflow.
# Не требует Windows-машины - GitHub даёт windows-latest runner.
# Сборка unsigned (без code-signing сертификата); Windows покажет SmartScreen
# warning при первом запуске - это нормально для внутреннего инструмента.

on:
  workflow_dispatch:
    inputs:
      build-type:
        description: 'Build type'
        required: true
        type: choice
        options:
          - release
          - debug
        default: release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' frontend/src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine build profile
        id: build-profile
        shell: bash
        run: |
          if [[ "${{ github.event.inputs.build-type }}" == "debug" ]]; then
            echo "profile=debug" >> "$GITHUB_OUTPUT"
            echo "args=--debug" >> "$GITHUB_OUTPUT"
          else
            echo "profile=release" >> "$GITHUB_OUTPUT"
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: windows-x64-vulkan-v2

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Configure Vulkan SDK env
        shell: pwsh
        run: |
          $vulkanSdk = $env:VULKAN_SDK
          if (-not $vulkanSdk -or -not (Test-Path $vulkanSdk)) {
            Write-Error "VULKAN_SDK not set"; exit 1
          }
          $binDir = Join-Path $vulkanSdk "Bin"
          $libDir = Join-Path $vulkanSdk "Lib"
          $includeDir = Join-Path $vulkanSdk "Include"
          "PATH=$binDir;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Vulkan_LIBRARY=$libDir\vulkan-1.lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Vulkan_INCLUDE_DIR=$includeDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VK_SDK_PATH=$vulkanSdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Copy Vulkan runtime for bundling
        shell: pwsh
        run: |
          $runtimeDir = "frontend/src-tauri/vulkan-runtime"
          New-Item -ItemType Directory -Force -Path $runtimeDir | Out-Null
          $vulkanSdk = $env:VULKAN_SDK
          $possiblePaths = @(
            "$vulkanSdk\Bin\vulkan-1.dll",
            "$vulkanSdk\runtime\x64\vulkan-1.dll",
            "$env:SystemRoot\System32\vulkan-1.dll"
          )
          $vulkanDll = $null
          foreach ($path in $possiblePaths) {
            if (Test-Path $path) { $vulkanDll = $path; break }
          }
          if ($vulkanDll) {
            Copy-Item $vulkanDll -Destination $runtimeDir
            Write-Host "Copied vulkan-1.dll"
          } else {
            $found = Get-ChildItem -Path "C:\" -Filter "vulkan-1.dll" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { Copy-Item $found.FullName -Destination $runtimeDir }
            else { Write-Warning "vulkan-1.dll not found" }
          }

      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install

      - name: Cache FFmpeg binary
        uses: actions/cache@v4
        with:
          path: frontend/src-tauri/binaries/ffmpeg-*.exe
          key: ${{ runner.os }}-ffmpeg-${{ hashFiles('frontend/src-tauri/build.rs', 'frontend/src-tauri/build/ffmpeg.rs') }}

      - name: Build Tauri app (unsigned)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          args: --target x86_64-pc-windows-msvc --features vulkan ${{ steps.build-profile.outputs.args }}

      - name: List build artifacts
        shell: bash
        run: |
          echo "## Build Artifacts"
          find target/x86_64-pc-windows-msvc/${{ steps.build-profile.outputs.profile }}/bundle -type f \( -name "*.msi" -o -name "*.exe" \) -exec ls -lh {} \; || true

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: insapp-meet-windows-x64-${{ steps.get-version.outputs.version }}
          path: |
            target/x86_64-pc-windows-msvc/${{ steps.build-profile.outputs.profile }}/bundle/msi/*.msi
            target/x86_64-pc-windows-msvc/${{ steps.build-profile.outputs.profile }}/bundle/nsis/*.exe
          retention-days: 30

      - name: Build summary
        shell: bash
        run: |
          echo "## Windows Build - Insapp-meet" >> $GITHUB_STEP_SUMMARY
          echo "Version: ${{ steps.get-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "Скачай установщик во вкладке Artifacts этого запуска." >> $GITHUB_STEP_SUMMARY
